name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # AB-28: pushing the image to GHCR.
  packages: write

jobs:
  # "Real streams before the tag" is this project's rule, and it was a manual
  # step — exactly the kind that gets skipped on the day it would have mattered.
  # Three of this repository's design errors were found here and none by a unit
  # test, so a tag does not ship without it.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: The reference streams
        run: |
          go build -o /tmp/abrsim ./cmd/abrsim
          ABRSIM_BIN=/tmp/abrsim go test -tags smoke -run TestSmokeReferenceStreams ./internal/analyze/ -v

  # The ritual itself, not a re-implementation of it. ci.yml runs the same gates as
  # separate steps because a failing step is easier to read in the Actions UI, and
  # release_test.sh asserts the two lists agree — but at a tag it is `release.sh
  # check` that runs, so what ships is what the script says it verified.
  ritual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # install-only: the ritual calls goreleaser check itself.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          install-only: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: scripts/release.sh check
        run: ./scripts/release.sh check

  goreleaser:
    needs: [smoke, ritual]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser needs the tags to work out the version and the previous one.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Dockerfile.release has no RUN steps — it only copies binaries goreleaser
      # already cross-compiled — so arm64 needs no emulation to build. QEMU is set
      # up anyway, so that stops being true loudly rather than silently if a RUN
      # ever appears.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The cask publishes to Allan-Nava/homebrew-tap, which this workflow's
          # GITHUB_TOKEN cannot write to: it is scoped to this repository. The PAT
          # is fine-grained, so it expires — when it does, the release publishes
          # its archives and then fails at the cask step. The artifacts are fine;
          # the tap is stale, and `brew install` keeps installing the old version
          # without saying so.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # The published image answers to the same contract as the binary, so it is checked
  # with the same kind of test rather than a different one — and after publishing,
  # because an image nobody ran is an archive with a registry in front of it.
  verify-image:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run the reference stream inside the image
        # goreleaser tags images with {{ .Version }}, which is the git tag *without*
        # its leading v — :0.4.1, never :v0.4.1. Using github.ref_name verbatim asks
        # for an image that was never published and fails a release that is fine.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          export ABRSIM_IMAGE="ghcr.io/allan-nava/abrsim:${TAG#v}"
          echo "verifying $ABRSIM_IMAGE"
          docker pull "$ABRSIM_IMAGE"
          go test -tags docker -run TestDockerImage ./internal/analyze/ -v

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          out=$(gofmt -l ./cmd ./internal)
          if [ -n "$out" ]; then echo "not gofmt'd:"; echo "$out"; exit 1; fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -coverprofile=cover.out ./...

      - name: coverage
        run: go tool cover -func=cover.out | tail -1

      # The zero-dependency promise is the product's differentiator, not an
      # aesthetic, so it is a gate rather than a note in the README.
      - name: no dependencies
        run: |
          if grep -q '^require' go.mod; then echo "go.mod grew a require block"; exit 1; fi
          if [ -s go.sum ]; then echo "go.sum is not empty"; exit 1; fi

      - name: backlog
        run: |
          ./scripts/backlog.sh lint
          ./scripts/backlog.sh check

      # The tooling that *writes* BACKLOG.md and CHANGELOG.md has its own tests,
      # and they are cheap: a bad `add` renumbers an item whose id every commit
      # message references, and a bad `prepare` ships a tag whose notes describe
      # a different version. Both run under /bin/sh, which on this runner is dash
      # rather than the bash-in-posix-mode a mac develops against.
      - name: tooling tests
        run: |
          sh ./scripts/backlog_test.sh
          sh ./scripts/release_test.sh

      # The Pages site and the README name the checks, traces, algorithms and
      # flags the binary has. Renaming one and forgetting the page is the drift
      # this catches; it has no network and no dependencies, like the rest.
      - name: docs
        run: ./scripts/docs.sh check

      # A deprecated goreleaser stanza fails `goreleaser check`, and without this
      # step the first push of a tag is where we would find out — after the tag
      # exists and with the release half-published. Checked on every commit
      # instead, where the fix is free.
      - name: release config
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

  # A red job here almost always means one thing: bump the `go` directive in
  # go.mod. setup-go installs *exactly* the version that directive names, so
  # `go 1.25.0` builds — and ships — a standard library carrying every advisory
  # published since 1.25.0. This is not a formality for abrsim: the binary makes
  # HTTPS requests and takes credentials in `--header`, so a reachable crypto/tls
  # or net/url advisory is in the product, not in a test.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...
